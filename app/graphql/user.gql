# OBJECT TYPES FOR OUTPUT
type User {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  firstName: String!
  otherNames: String!
  email: String!
  phoneNumber: String!
}

# QUERIES
extend type Query {
  users: [User!]!
}

# MUTATIONS
extend type Mutation {
  createUser(input: NewUserDto!): User!
}

# INPUTS
input NewUserDto {
  firstName: String!
  otherNames: String!
  email: String!
  phoneNumber: String!
}
