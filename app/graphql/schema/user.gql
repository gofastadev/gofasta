# OBJECT TYPES FOR OUTPUT
type User {
  id: ID!
  recordVersion: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  firstName: String!
  otherNames: String!
  email: String!
  phoneNumber: String!
  isActive: Boolean!
  isDeletable: Boolean!
}

type UsersResponseDto {
  users: [User!]!
  pagination: TPaginationObjectDto!
}

type UserResponseDto {
  data: User
  errors: [TCommonApiErrorDto]
}

# QUERIES
extend type Query {
  findUsersWithFilters(filters: UserFiltersDto!): UsersResponseDto!
}

# MUTATIONS
extend type Mutation {
  createUser(input: NewUserDto!): UserResponseDto!
  updateUser(input: TUserFieldsForUpdateDto!): UserResponseDto!
}

# INPUTS
input NewUserDto {
  firstName: String!
  otherNames: String!
  email: String!
  phoneNumber: String!
}

input UserFieldsForFiltersDto {
  firstName: String
  otherNames: String
  email: String
  phoneNumber: String
}

input UserFiltersDto {
  fields: UserFieldsForFiltersDto
  pagination: TPaginationInputDto
  sorting: TSortingInputDto
}

input TUserFieldsForUpdateDto {
  id: ID!
  RecordVersion: Int!
  firstName: String
  otherNames: String
  email: String
  phoneNumber: String
  IsActive: Boolean
  IsDeletable: Boolean
}
