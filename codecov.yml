coverage:
  precision: 2
  round: down
  range: "95...100"

  status:
    project:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error
        only_pulls: false
    patch:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "header, diff, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true

ignore:
  - "**/*_test.go"
  - "pkg/testutil/**"
  - "examples/**"
