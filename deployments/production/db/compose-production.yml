services:
  gofasta_postgres_prod:
    build:
      context: .
      dockerfile: dockerfile
      target: ${PROJECT_NAME}_db_build_${ENV}
    image: ${PROJECT_NAME}_db_image_${ENV}
    container_name: ${PROJECT_NAME}_db_container_${ENV}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - type: bind
        source: /var/lib/docker/volumes/.healtron_live_databases/${PROJECT_NAME}/postgresql/${ENV}
        target: /var/lib/postgresql
    ports:
      - ${DB_HOST_PORT}:${DB_INTERNAL_PORT}
    networks:
      - ${DOCKER_NETWORK_NAME}
    restart: always
    profiles:
      - db

networks:
  healtron_network_prod:
    external: true
