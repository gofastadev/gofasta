apiVersion: v1
kind: Service
metadata:
  name: gofasta
  labels:
    app: gofasta
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: gofasta

---
# Database service (for dev/staging — use managed DB in production)
apiVersion: v1
kind: Service
metadata:
  name: gofasta-db
  labels:
    app: gofasta-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: gofasta-db
