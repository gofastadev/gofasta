# Ingress — configure your domain and TLS.
# Works with nginx-ingress, traefik, ALB ingress controller, etc.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gofasta
  annotations:
    # Uncomment for nginx-ingress:
    # kubernetes.io/ingress.class: nginx
    # Uncomment for AWS ALB:
    # kubernetes.io/ingress.class: alb
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # Uncomment for cert-manager TLS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - api.example.com
  #     secretName: gofasta-tls
  rules:
    - host: api.example.com    # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gofasta
                port:
                  number: 80
