# .github/workflows/deploy-vps.yml
# Deploy to any VPS via SSH (Docker or bare metal).
# Copy to .github/workflows/ and set GitHub secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, DEPLOY_METHOD (docker or binary)

name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy-docker:
    if: ${{ vars.DEPLOY_METHOD == 'docker' || vars.DEPLOY_METHOD == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/gofasta
            git pull origin main
            docker compose -f deployments/docker/compose.production.yaml up -d --build
            echo "Deployed successfully!"

  deploy-binary:
    if: ${{ vars.DEPLOY_METHOD == 'binary' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o gofasta ./app/main

      - name: Deploy binary via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "gofasta,config.yaml,db/migrations/*,templates/*"
          target: /etc/gofasta/

      - name: Restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo mv /etc/gofasta/gofasta /usr/local/bin/gofasta
            sudo chmod +x /usr/local/bin/gofasta
            cd /etc/gofasta && sudo -u gofasta /usr/local/bin/gofasta migrate up || true
            sudo systemctl restart gofasta
