# .github/workflows/release.yml
# Builds and publishes gofasta CLI binaries on every tag.
# Also publishes to Homebrew tap.
#
# Usage: git tag v1.0.0 && git push origin v1.0.0
# Copy this file to .github/workflows/release.yml

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binaries
        run: |
          mkdir -p dist

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/gofasta-linux-amd64 ./cmd/gofasta
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/gofasta-linux-arm64 ./cmd/gofasta
          # macOS amd64 (Intel)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/gofasta-darwin-amd64 ./cmd/gofasta
          # macOS arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/gofasta-darwin-arm64 ./cmd/gofasta
          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/gofasta-windows-amd64.exe ./cmd/gofasta

          # Create checksums
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
