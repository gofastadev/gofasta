name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Run tests
        run: go test -race ./...

      - name: Verify build
        run: go build ./...

      # The library ships no binaries — Go's module proxy serves consumers
      # straight from the pushed Git tag. GoReleaser is invoked with build
      # and archive steps skipped; it only publishes a curated GitHub release
      # body so the release page stays consistent with the cli repo's.
      - name: GoReleaser (release page only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=build,archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
