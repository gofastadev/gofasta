name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"

      - name: Download dependencies
        run: go mod download

      # Same -timeout headroom as ci.yml: the suite includes
      # testcontainers integration tests that blow through `go test`'s
      # 10-minute default on a cold runner, and a release must not fail
      # on a timeout CI would pass.
      - name: Run tests
        run: go test -race -shuffle=on -timeout 20m ./...

      - name: Verify build
        run: go build ./...

      # The library ships no binaries — Go's module proxy serves consumers
      # straight from the pushed Git tag. GoReleaser is invoked with the
      # archive phase skipped (the build phase is skipped at config level
      # via `builds: [{skip: true}]` in .goreleaser.yaml; in GoReleaser v2,
      # `build` is not a valid CLI --skip option). The result is a curated
      # GitHub release page only, consistent with the cli repo's release
      # pages.
      - name: GoReleaser (release page only)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
