name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly: surfaces breakage from upstream (new Go point releases,
  # testcontainers image updates) without waiting for a push.
  schedule:
    - cron: "29 4 * * 3"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"

      - name: Docs check
        run: make docs-check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The newest patch of the declared floor (exact-pinning the .0
        # patch freezes CI on unpatched stdlib — govulncheck fails on
        # reachable stdlib CVEs) plus current stable.
        go-version: ["1.25.x", "stable"]
    # Without GOTOOLCHAIN=local the go command silently upgrades itself
    # to go.mod's toolchain and the matrix tests one version twice.
    env:
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Test with coverage
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.25.x'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          slug: gofastadev/gofasta
          files: coverage.out
          fail_ci_if_error: false

      - name: Build
        run: go build ./...

  # The library is consumed on every OS gofasta users develop on; this
  # job guarantees the packages (and their test code, via vet) compile
  # on macOS and Windows. Tests stay on Linux — the integration suites
  # are testcontainers-based and mac/windows runners have no Docker.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Build
        run: go build ./...
      - name: Vet (compiles all test code)
        run: go vet ./...
