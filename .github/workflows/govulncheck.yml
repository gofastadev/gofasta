name: govulncheck

# Reachability-based vulnerability scanning (the Go team's scanner) —
# reports only CVEs whose vulnerable symbols this module actually
# calls. Runs on every PR/push AND on a weekly schedule so a CVE
# published against an existing dependency surfaces without waiting
# for the next code change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"

      # Hard gate: every shipped runtime package must be clean.
      # pkg/testutil is excluded from the gate because it links the
      # Docker client through testcontainers-go, and docker/docker
      # carries advisories with NO fixed Go module version published
      # ("Fixed in: N/A") — reachable only via package init, in a
      # helper that talks to a local Docker daemon in tests. Blocking
      # every merge on an unfixable upstream finding trains people to
      # ignore the gate.
      - name: govulncheck (shipped packages — blocking)
        run: |
          # shellcheck disable=SC2046 # go list output is one clean package path per line
          go run golang.org/x/vuln/cmd/govulncheck@latest $(go list ./... | grep -v '/testutil/')

      # Full-tree scan stays visible in every run's log (including the
      # docker/docker findings above) but does not fail the job. Remove
      # the continue-on-error once upstream publishes fixed versions.
      - name: govulncheck (full tree incl. testutil — informational)
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
